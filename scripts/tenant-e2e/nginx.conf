# nginx in front of the private files, as on the server (there with
# fastcgi_pass to PHP-FPM; here the test WordPress runs Apache, so the
# check is proxied). See PLAN-rsp-tenant-admin-sso.md, fase 3.
server {
    listen 80;
    root /var/www/html;

    location = /internal/avpvh/file-auth {
        internal;
        proxy_pass http://wp/avpvh-file-auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host localhost:8088;
        proxy_set_header X-Original-URI $request_uri;
    }

    location ^~ /wp-content/uploads/private/ {
        auth_request /internal/avpvh/file-auth;
        auth_request_set $avpvh_login $upstream_http_x_avpvh_login;
        error_page 401 =302 $avpvh_login;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
