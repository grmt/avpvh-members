# SonarQube Cloud automatic analysis.
# The scripts/test-*.php fixtures and the tenant-e2e harness define their own
# stand-ins for WordPress functions (wp_send_json_error, get_post, ...) with
# fewer parameters. Analysed as main code, Sonar takes those as the real
# signatures and flags every plugin call as having the wrong argument count.
sonar.sources=.
sonar.exclusions=scripts/test-*.php,scripts/tenant-e2e/**
sonar.tests=scripts
sonar.test.inclusions=scripts/test-*.php,scripts/tenant-e2e/**

# WordPress naming: functions and methods are snake_case and classes are
# Underscore_Separated (WordPress Coding Standards, enforced by PHPCS).
# Sonar's php:S100 (function names) and php:S101 (class names) expect
# camelCase/PascalCase and would flag nearly every declaration.
sonar.issue.ignore.multicriteria=wpfn,wpcls
sonar.issue.ignore.multicriteria.wpfn.ruleKey=php:S100
sonar.issue.ignore.multicriteria.wpfn.resourceKey=**/*.php
sonar.issue.ignore.multicriteria.wpcls.ruleKey=php:S101
sonar.issue.ignore.multicriteria.wpcls.resourceKey=**/*.php
