# SonarQube Cloud automatic analysis.
# The scripts/test-*.php fixtures and the tenant-e2e harness define their own
# stand-ins for WordPress functions (wp_send_json_error, get_post, ...) with
# fewer parameters. Analysed as main code, Sonar takes those as the real
# signatures and flags every plugin call as having the wrong argument count.
sonar.sources=.
sonar.exclusions=scripts/test-*.php,scripts/tenant-e2e/**
sonar.tests=scripts
sonar.test.inclusions=scripts/test-*.php,scripts/tenant-e2e/**
