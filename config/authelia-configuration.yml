---
###############################################################
#                   Authelia configuration                    #
###############################################################
# Deploy: sudo cp authelia-configuration.yml /opt/docker/volumes/authelia/config/configuration.yml
# Then:   docker compose restart authelia
#
# IMPORTANT: this switches authentication_backend from file to LDAP.
# LLDAP must be running and the 'admin' user provisioned before restarting Authelia.
# The old users_database.yml test user ('authelia') is no longer needed.

server:
  address: 'tcp://:9091'
  asset_path: '/config/assets'
  headers:
    csp_template: "default-src 'self'; frame-src 'none'; object-src 'none'; style-src 'self' 'nonce-${NONCE}' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-+OsIn6RhyCZCUkkvtHxFtP0kU3CGdGeLjDd9Fzqdl3o='; script-src 'self' 'nonce-${NONCE}'; connect-src 'self' https://api.pwnedpasswords.com"

log:
  level: 'info'

totp:
  issuer: 'avphilipsvanhorne.nl'

password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

identity_validation:
  reset_password:
    jwt_secret: ''  # loaded via AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE

authentication_backend:
  ldap:
    address: 'ldap://lldap:3890'
    base_dn: 'dc=avpvh,dc=nl'
    additional_users_dn: 'ou=people'
    users_filter: '(&(|({username_attribute}={input})({mail_attribute}={input}))(objectClass=person))'
    additional_groups_dn: 'ou=groups'
    groups_filter: '(member={dn})'
    attributes:
      username: 'uid'
      mail: 'mail'
      display_name: 'displayName'
      group_name: 'cn'
    user: 'uid=admin,ou=people,dc=avpvh,dc=nl'
    password: ''  # loaded via AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE

access_control:
  default_policy: 'deny'
  rules:
    # rechtspreker.nl is NOT handled by Authelia — served directly without SSO.

    - domain: 'auth.avphilipsvanhorne.nl'
      policy: 'bypass'

    # LLDAP admin UI — two-factor only
    - domain: 'leden-admin.avphilipsvanhorne.nl'
      policy: 'two_factor'

    # admin-ajax.php is used for frontend AJAX by plugins/themes — bypass Authelia,
    # WordPress handles nonce/capability checks itself. Must come before the wp-admin rule.
    - domain: 'www.avphilipsvanhorne.nl'
      resources:
        - '^/wp-admin/admin-ajax\.php'
      policy: 'bypass'

    # wp-admin requires two-factor
    - domain: 'www.avphilipsvanhorne.nl'
      resources:
        - '^/wp-admin/.*'
      policy: 'two_factor'

    # All other pages: bypass Authelia, WordPress plugin handles access control
    - domain: 'www.avphilipsvanhorne.nl'
      policy: 'bypass'

    # these domains redirect to www.avphilipsvanhorne.nl via nginx
    - domain: 'avphilipsvanhorne.nl'
      policy: 'bypass'

    - domain: 'avpvh.nl'
      policy: 'bypass'

    - domain: 'www.avpvh.nl'
      policy: 'bypass'

session:
  secret: ''  # loaded via AUTHELIA_SESSION_SECRET_FILE

  cookies:
    - name: 'avpvh_session'
      domain: 'avphilipsvanhorne.nl'
      authelia_url: 'https://auth.avphilipsvanhorne.nl'
      default_redirection_url: 'https://www.avphilipsvanhorne.nl/avpvh-login/'
      expiration: '8 hours'
      inactivity: '30 minutes'

  redis:
    host: 'redis'
    port: 6379

regulation:
  max_retries: 3
  find_time: '2 minutes'
  ban_time: '5 minutes'

storage:
  encryption_key: ''  # loaded via AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
  local:
    path: '/config/db.sqlite3'

notifier:
  smtp:
    address: 'smtp.gmail.com:587'
    sender: 'no-reply@avphilipsvanhorne.nl'
    username: 'garmt@avphilipsvanhorne.nl'
    # password loaded from Docker secret via AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE

