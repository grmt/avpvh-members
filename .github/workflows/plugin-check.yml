name: "Plugin Check"

on:
  push:
    branches: "*"
  pull_request:

jobs:
  plugin-check:
    name: "WordPress Plugin Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Run plugin check"
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: |
            scripts
            config
            .agents
            .codex
            .claude
            bin
