name: "Plugin Check"

on:
  push:
    # "*" only matches single-segment branch names (no "/"), so
    # "fix/..."-style branches never triggered this — "**" is needed to
    # actually cover them.
    branches: "**"
  pull_request:

jobs:
  plugin-check:
    name: "WordPress Plugin Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # Report-only for now — this plugin predates Plugin Check and has a
      # real backlog (down from 678 warnings/several dozen errors on
      # 2026-08-22, being worked through). continue-on-error lets the step
      # run the real check and keep reporting every finding as a normal
      # annotation, just without failing the job over a backlog that's
      # still being triaged — unlike ignore-warnings/ignore-errors, which
      # get passed straight to the underlying `wp plugin check` CLI and
      # stop it from evaluating warnings/errors at all (tried that first;
      # it silently suppressed all reporting, not just the pass/fail call).
      - name: "Run plugin check"
        continue-on-error: true
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: |
            scripts
            config
            .agents
            .codex
            .claude
            bin
            .github
          # file_type also flags "unexpected markdown file" for this repo's
          # own planning docs, which intentionally live at the plugin root
          # rather than in a subdirectory — narrower than excluding the
          # whole file_type check (which also covers hidden/compressed
          # files, VCS dirs, and badly-named files we do still want
          # flagged). exclude-files takes exact filenames only — confirmed
          # by testing: PLAN*.md-style globs are silently not matched, so
          # this list needs a new line added whenever a new one of these
          # docs is created, rather than relying on the naming pattern.
          exclude-files: |
            AGENTS.md
            DEPLOY.md
            TESTING.md
            GEMINI.md
            PLAN.md
            PLAN-dtap-environments.md
            PLAN-email-login-followup.md
            PLAN-email-login.md
            PLAN-openresty-jwt.md
            PLAN-plugin-check-cleanup.md
            PLAN-workspace-addressbook-sync.md
            PLAN-workspace-group-sync.md
            PLAN-workspace-sync-implementation.md
            DESIGN-workspace-sync.md
            WORKFLOW-version-test-deploy.md
            ROLLBACK-email-login.md
          # direct_db_queries flags any use of $wpdb without an object-cache
          # wrapper — this plugin's whole DB layer is custom $wpdb queries
          # joining WordPress and LLDAP tables (see class-db.php's
          # member_select()), which isn't something WP's post/option-
          # oriented caching APIs are built around, and there's no
          # persistent object cache backend configured on this site anyway
          # (the redis container in the stack is Authelia's, not wired to
          # WordPress). A deliberate architectural choice, not a gap — not
          # excluding direct_db, the separate check for actual
          # escaping/SQL-injection safety within those queries.
          #
          # plugin_readme and trademarks are wordpress.org-submission
          # checks (readme.txt "Stable Tag"/"Tested up to" headers, the
          # plugin name not containing "plugin") that don't apply — this
          # plugin is a private single-site build that will never be
          # distributed there. plugin_header_fields and file_type are
          # NOT excluded outright (see the License header just added, and
          # exclude-files/exclude-directories above) — the one expected
          # plugin_header_fields warning left is plugin_header_invalid_
          # plugin_version, for the "1.0.N+<hash>" Version suffix (see
          # AGENTS.md), a deliberate project convention.
          exclude-checks: |
            direct_db_queries
            plugin_readme
            trademarks
