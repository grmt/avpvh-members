name: "Plugin Check"

on:
  push:
    branches: "*"
  pull_request:

jobs:
  plugin-check:
    name: "WordPress Plugin Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Run plugin check"
        uses: wordpress/plugin-check-action@v1
        with:
          exclude-directories: |
            scripts
            config
            .agents
            .codex
            .claude
            bin
          # Report-only for now — this plugin predates Plugin Check and
          # has a real backlog (678 warnings, several dozen errors as of
          # 2026-08-22, some of which are readme.txt/.org-submission
          # fields that don't even apply to a private, non-.org plugin).
          # Findings still show in the run log and the uploaded
          # plugin-check-results artifact; this just stops CI going red
          # over a pre-existing backlog nobody's triaged yet.
          ignore-warnings: true
          ignore-errors: true
