name: "CI"
on:
  # Branches are tested through their pull request (the merge result);
  # main once more after each merge.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs CI and zips its build.
  workflow_call:
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # git archive honours export-ignore in .gitattributes, so this holds
      # exactly what a live deploy holds — no plans, scripts or CI files.
      - name: "Package what a deploy ships"
        run: |
          mkdir build
          git archive HEAD | tar -x -C build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: build

  # Shared with the other own plugins: syntax on 8.4 and 8.5,
  # PHPCompatibility and the WordPress.org Plugin Check on the build.
  plugin-checks:
    name: "Shared"
    needs: build
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-members
      artifact: build-artifact
      # No whole checks are skipped and no findings are ignored, except:
      # plugin_updater_detected — the Update URI points at this repo on
      # purpose; the rule is for plugins hosted on wordpress.org.
      #
      # The remaining warnings (direct $wpdb queries without caching, the
      # backlog in PLAN-plugin-check-cleanup.md) show up in the report but
      # don't fail the job.
      ignore-codes: |
        plugin_updater_detected

  # The stand-alone test scripts (scripts/test-*.php): they stub WordPress
  # themselves, so no WordPress install is needed. The integration tests
  # among them print SKIP without their throwaway LDAP server or database;
  # ldap is switched off here so the two directory tests skip too.
  tests:
    name: "Test scripts (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      - name: "Set up PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: :ldap
          coverage: none

      - name: "Run scripts/test-*.php"
        run: |
          failed=()
          for t in scripts/test-*.php; do
            if out=$(php "$t" 2>&1); then
              echo "pass  $t$(grep -m1 '^SKIP' <<<"$out" | sed 's/^/  (/; s/$/)/')"
            else
              echo "FAIL  $t"
              echo "$out" | tail -20 | sed 's/^/      /'
              failed+=("$t")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::${#failed[@]} test script(s) failed: ${failed[*]}"
            exit 1
          fi
