name: "CI"
on:
  push:
    # "*" only matches single-segment branch names (no "/"); "**" also
    # covers "fix/..."-style branches.
    branches: "**"
  pull_request:
  # The release workflow runs CI and zips its build.
  workflow_call:
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@v7

      # git archive honours export-ignore in .gitattributes, so this holds
      # exactly what a live deploy holds — no plans, scripts or CI files.
      - name: "Package what a deploy ships"
        run: |
          mkdir build
          git archive HEAD | tar -x -C build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v7
        with:
          name: "build-artifact"
          path: build

  # Shared with the other own plugins: syntax on 8.4 and 8.5,
  # PHPCompatibility and the WordPress.org Plugin Check on the build.
  plugin-checks:
    name: "Shared"
    needs: build
    uses: grmt/wp-plugin-ci/.github/workflows/plugin-checks.yml@main
    with:
      slug: avpvh-members
      artifact: build-artifact
      # No whole checks are skipped; the codes below are ignored one by one.
      #
      # plugin_header_invalid_plugin_version: the "1.0.N+<hash>" Version
      # build metadata (see WORKFLOW-version-test-deploy.md) is a deliberate
      # project convention. plugin_updater_detected: the Update URI points
      # at this repo, also deliberate.
      #
      # DirectDatabaseQuery.*: this plugin's whole DB layer is custom $wpdb
      # queries joining WordPress and LLDAP tables (see class-db.php's
      # member_select()), with schema changes in its migrations, and the
      # site has no persistent object cache. A deliberate architectural
      # choice — the escaping/SQL-injection checks (PreparedSQL.*) still run.
      #
      # The other warnings are the remaining backlog: they show up in the
      # report but don't fail the job.
      ignore-codes: |
        plugin_header_invalid_plugin_version
        plugin_updater_detected
        WordPress.DB.DirectDatabaseQuery.DirectQuery
        WordPress.DB.DirectDatabaseQuery.NoCaching
        WordPress.DB.DirectDatabaseQuery.SchemaChange
